<!doctype html>
<html lang="ja">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<meta name="apple-mobile-web-app-capable" content="yes">
<title>現場ツール</title>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=BIZ+UDPGothic:wght@400;700&family=BIZ+UDPMincho:wght@700&display=swap">
<style>
:root{--bg:#f2f3f1;--surface:#fff;--fg:#21251f;--muted:#666d63;--line:#d7dad3;--accent:#2f5d46;
  --f-body:"BIZ UDPGothic","Hiragino Kaku Gothic ProN","Yu Gothic","Meiryo",sans-serif;--f-title:"BIZ UDPMincho","Hiragino Mincho ProN","Yu Mincho",serif}
@media (prefers-color-scheme:dark){:root{--bg:#171a16;--surface:#21251f;--fg:#e7eae2;--muted:#a2a89a;--line:#363b32;--accent:#7fb495;color-scheme:dark}}
*{box-sizing:border-box}
body{margin:0;background:var(--bg);color:var(--fg);font-family:var(--f-body);line-height:1.6;
  padding:max(28px,env(safe-area-inset-top)) max(16px,env(safe-area-inset-right)) 40px max(16px,env(safe-area-inset-left))}
main{max-width:640px;margin:0 auto;display:flex;flex-direction:column;gap:16px}
h1{font-family:var(--f-title);font-size:26px;margin:0}
p{margin:0;color:var(--muted)}
a.tool{display:flex;flex-direction:column;gap:4px;background:var(--surface);border:1px solid var(--line);border-radius:12px;padding:18px;color:var(--fg);text-decoration:none}
a.tool:hover,a.tool:focus-visible{border-color:var(--accent);outline:none}
a.tool b{font-size:18px;color:var(--accent)}
a.tool span{color:var(--muted);font-size:14px}
.note{font-size:12px}
</style>
</head>
<body>
<main>
  <h1>現場ツール</h1>
  <p>スマホで打って、A4・1枚のPDFに。登録もアプリもいりません。</p>
  <a class="tool" href="shiyousho.html"><b>外構仕様書メーカー</b><span>工種ごとに「含む／別途／なし」を選んで、見積に添える仕様書を作ります。</span></a>
  <a class="tool" href="uchiawase.html"><b>現場打ち合わせシート</b><span>元請・下請の打ち合わせを、地図のQRつきで記録。LINE用の文章もコピーできます。</span></a>
  <p class="note">入力した内容は、お使いの端末の中にだけ残ります。どこにも送られません。</p>
</main>
</body>
</html>
